services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siddhu5pute
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: osto_auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siddhu5pute"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: siddhu5pute
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: osto_auth
    stdin_open: true
    tty: true

volumes:
  pgdata:
